name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest
      - name: Readouts + quick validation
        run: python -m abtestlab.run
      - run: python -m abtestlab.run --srm-bug
      - run: python -m abtestlab.validate --sims 50
